databases:
  - name: c-money-db
    plan: free

services:
  - type: web
    name: c-money-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app.main:app
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: c-money-db
          property: connectionString
